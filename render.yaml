# Render blueprint: the API service only. PostgreSQL is hosted on Neon.
#
# Deploy with: New > Blueprint, point it at this repository.
#
# Render's own free Postgres is deleted after 30 days, which is fatal for a
# demo link that has to keep working. Neon's free tier does not expire, so the
# database lives there and only the stateless API runs here.
#
# Two values are deliberately left unset (`sync: false`), because neither
# exists until something else has been deployed:
#   DATABASE_URL  - the Neon connection string
#   CORS_ORIGINS  - the Vercel dashboard origin. A wildcard would let any site
#                   on the internet call this API with a user's token.
services:
  - type: web
    name: payments-ledger-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # Any value outside {local, test, ci} makes the app refuse to boot with
      # the development secrets. That refusal is the point.
      - key: ENVIRONMENT
        value: production
      # Neon connection string, from the Neon dashboard. Use the *pooled*
      # host (it contains `-pooler`) and keep `?sslmode=require`.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and never printed in a build log.
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Set this to the deployed dashboard origin, e.g.
      # https://payments-ledger-dashboard.vercel.app
      - key: CORS_ORIGINS
        sync: false
