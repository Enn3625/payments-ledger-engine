name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The suite is deliberately integration-level: the ledger invariant lives in
    # a deferred constraint trigger that only fires at COMMIT, so there is no
    # honest way to test it without a real PostgreSQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_test
      TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations apply and reverse cleanly
        # A migration that cannot be rolled back is a migration you cannot
        # safely deploy, so the reverse path is tested too.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models match migrations
        # Catches a model edited without a matching migration, which would
        # otherwise only surface as a confusing runtime error in production.
        run: alembic check

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so this fails if the
      # API types and the components have drifted apart.
      - name: Typecheck and build
        run: npm run build
